version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # PDFsharp is intentionally pinned to [6.2.4] in the Core project.
      - dependency-name: "PDFsharp"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
