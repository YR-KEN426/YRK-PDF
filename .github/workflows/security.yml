name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '43 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  BINSKIM_VERSION: '4.4.9.13'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  vulnerable-packages:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Restore packages
        run: |
          # NuGet can otherwise report an unavailable audit source as a warning.
          dotnet restore YrkPdfStudio.slnx -p:WarningsAsErrors=NU1900
          if ($LASTEXITCODE -ne 0) { throw 'Package restore or vulnerability audit failed.' }
      - name: Check vulnerable packages
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP 'vulnerable-packages.json'
          $errorPath = Join-Path $env:RUNNER_TEMP 'vulnerable-packages.stderr.txt'
          dotnet list YrkPdfStudio.slnx package --vulnerable --include-transitive --format json > $reportPath 2> $errorPath
          $scanExitCode = $LASTEXITCODE
          $reportText = Get-Content -LiteralPath $reportPath -Raw
          $errorText = Get-Content -LiteralPath $errorPath -Raw
          Write-Output $reportText
          if (-not [string]::IsNullOrWhiteSpace($errorText)) { Write-Output $errorText }
          if ($scanExitCode -ne 0 -or -not [string]::IsNullOrWhiteSpace($errorText)) {
            throw 'NuGet could not produce a complete vulnerability report.'
          }
          $report = $reportText | ConvertFrom-Json -ErrorAction Stop
          if ($report.version -ne 1 -or $null -eq $report.projects -or @($report.projects).Count -eq 0) {
            throw 'The vulnerability report is empty or has an unsupported schema.'
          }
          # Inspect problems at every level, and both direct and transitive packages.
          function Assert-NoAuditProblems($node) {
            if ($null -eq $node) { return }
            if ($node -is [System.Management.Automation.PSCustomObject]) {
              foreach ($property in $node.PSObject.Properties) {
                if ($property.Name -eq 'problems' -and $null -ne $property.Value -and @($property.Value).Count -gt 0) {
                  throw 'NuGet reported problems while checking vulnerability sources.'
                }
                if ($property.Name -eq 'vulnerabilities' -and $null -ne $property.Value -and @($property.Value).Count -gt 0) {
                  throw 'Vulnerable packages were found. See the JSON report above.'
                }
                Assert-NoAuditProblems $property.Value
              }
            } elseif ($node -is [System.Collections.IEnumerable] -and $node -isnot [string]) {
              foreach ($item in $node) { Assert-NoAuditProblems $item }
            }
          }
          Assert-NoAuditProblems $report
          # A clean project is listed with only its path (no "frameworks"), so do not require frameworks here.
          foreach ($project in $report.projects) {
            if ([string]::IsNullOrWhiteSpace($project.path)) { throw 'The vulnerability report lists a project without a path.' }
          }
          Write-Output 'The vulnerability audit completed with no vulnerable packages.'

  gitleaks:
    runs-on: windows-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install and verify gitleaks
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'gitleaks'
          Invoke-WebRequest -Uri 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $archive
          $expectedHash = 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'The gitleaks archive checksum does not match.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
      - name: Scan history for secrets
        run: |
          $gitleaks = Join-Path $env:RUNNER_TEMP 'gitleaks/gitleaks.exe'
          $scanArguments = @('git', '--redact', '--no-banner')
          if (Test-Path -LiteralPath '.gitleaks.toml' -PathType Leaf) {
            $scanArguments += @('--config', '.gitleaks.toml')
          }
          & $gitleaks @scanArguments
          if ($LASTEXITCODE -ne 0) { throw 'Gitleaks found secrets or could not complete the scan.' }

  binskim:
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Build Release
        run: |
          dotnet build YrkPdfStudio.slnx --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'The Release build failed.' }
      - name: Install BinSkim
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'microsoft.codeanalysis.binskim.nupkg'
          $archive = Join-Path $env:RUNNER_TEMP 'binskim.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'binskim'
          $version = $env:BINSKIM_VERSION
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.codeanalysis.binskim/$version/microsoft.codeanalysis.binskim.$version.nupkg" -OutFile $package
          # Refuse a package whose NuGet signatures (Microsoft author + nuget.org repository) do not verify.
          dotnet nuget verify $package --all
          if ($LASTEXITCODE -ne 0) { throw 'The BinSkim package signature did not verify.' }
          Copy-Item -LiteralPath $package -Destination $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          # The NuGet package contains platform-specific executables under tools/.
          $executables = @(Get-ChildItem -LiteralPath (Join-Path $destination 'tools') -Filter BinSkim.exe -File -Recurse |
            Where-Object { $_.Directory.Name -eq 'win-x64' })
          if ($executables.Count -ne 1) { throw 'Expected exactly one Windows x64 BinSkim executable.' }
          "BINSKIM_EXE=$($executables[0].FullName)" >> $env:GITHUB_ENV
      - name: Scan application binaries
        id: scan
        run: |
          $outputDirectory = Join-Path $env:GITHUB_WORKSPACE 'src/Yrk.PdfStudio.App/bin/Release/net10.0-windows'
          $files = @(Get-ChildItem -LiteralPath $outputDirectory -File |
            Where-Object { $_.Name -like 'Yrk*.dll' -or $_.Name -eq 'YrkEasyPdf.exe' } |
            Sort-Object Name | Select-Object -ExpandProperty FullName)
          foreach ($required in @('YrkEasyPdf.dll', 'YrkEasyPdf.exe', 'Yrk.PdfStudio.Core.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $outputDirectory $required) -PathType Leaf)) {
              throw "Expected application binary is missing: $required"
            }
          }
          if ($files.Count -eq 0) { throw 'No application binaries were found.' }
          $sarifPath = Join-Path $env:RUNNER_TEMP 'binskim.sarif'
          Write-Output $files
          # Rich return codes distinguish findings from execution failures.
          & $env:BINSKIM_EXE analyze @files --output $sarifPath --sarif-output-version Current --rich-return-code true
          $scanExitCode = $LASTEXITCODE
          if (-not (Test-Path -LiteralPath $sarifPath -PathType Leaf)) { throw 'BinSkim did not produce SARIF.' }
          $sarif = Get-Content -LiteralPath $sarifPath -Raw | ConvertFrom-Json -ErrorAction Stop
          if ($sarif.version -ne '2.1.0' -or $null -eq $sarif.runs -or @($sarif.runs).Count -eq 0) { throw 'BinSkim produced invalid SARIF.' }
          "sarif-path=$sarifPath" >> $env:GITHUB_OUTPUT
          # Ignore the documented nonfatal bits (0xF8000000) except TargetNotValidToAnalyze
          # (0x20000000) fails too, because every file passed here is our own binary and must be analyzed.
          if (($scanExitCode -band 0x27FFFFFF) -ne 0) {
            throw "BinSkim failed to execute completely (exit code $scanExitCode)."
          }
          Write-Output "BinSkim completed (exit code $scanExitCode); findings are reported through SARIF."
          exit 0
      - name: Upload BinSkim SARIF
        if: ${{ !cancelled() && steps.scan.outputs.sarif-path != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif-path }}
          category: binskim
